name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug --no-daemon > build.log 2>&1
      - name: Show errors
        if: failure()
        run: |
          grep -E "AAPT|linking failed|ERROR|^e: " -A4 build.log | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: FajrPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
